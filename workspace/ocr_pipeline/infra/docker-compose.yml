# Local OwnCloud Infinite Scale (OCIS) + PostgreSQL catalog.
# Product: ownCloud GmbH — NOT Nextcloud (fork).
# Latest production line: Infinite Scale 8.x (image owncloud/ocis:8.0.4).
# Postgres uses host port 5433 to avoid conflict with other local Postgres.

services:
  ocr-postgres:
    image: postgres:16-alpine
    container_name: ocr-pipeline-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ocr
      POSTGRES_PASSWORD: ocr
      POSTGRES_DB: ocr_catalog
    volumes:
      - ocr_pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocr -d ocr_catalog"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocis:
    image: owncloud/ocis:8.0.4
    container_name: ocr-owncloud-ocis
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      OCIS_INSECURE: "true"
      OCIS_URL: "https://127.0.0.1:9200"
      PROXY_HTTP_ADDR: "0.0.0.0:9200"
      OCIS_LOG_LEVEL: info
      PROXY_ENABLE_BASIC_AUTH: "true"
      IDM_ADMIN_PASSWORD: "admin"
    volumes:
      - ocis_config:/etc/ocis
      - ocis_data:/var/lib/ocis
    entrypoint: ["/bin/sh", "-c"]
    command: ["ocis init --insecure yes 2>/dev/null || true; exec ocis server"]

volumes:
  ocr_pg_data:
  ocis_config:
  ocis_data:
